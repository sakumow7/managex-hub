name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: managex_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d managex_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      JWT_SECRET: ci-only-secret-for-disposable-testing-12345
      DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/managex_test
      TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/managex_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - run: pip install -r requirements-lock.txt
      - run: ruff check .
      - run: pytest -q
      - run: alembic upgrade head
      - run: alembic check

  browser-and-containers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        demo: ["false", "true"]
    env:
      BASE_URL: http://127.0.0.1:8080
      DEMO_PASSWORD: SamplePass123!
      DEMO_ENABLED: ${{ matrix.demo }}
      VITE_DEMO_MODE: ${{ matrix.demo }}
      DEMO_E2E: ${{ matrix.demo }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: cp .env.example .env
      - run: docker compose up --build -d --wait
      - run: docker compose exec -T api python -m app.seed
        if: matrix.demo == 'false'
      - run: npm run test:e2e
        working-directory: frontend
      - name: Container diagnostics
        if: failure()
        run: docker compose logs
      - name: Save browser traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-traces-demo-${{ matrix.demo }}
          path: frontend/test-results
      - if: always()
        run: docker compose down
